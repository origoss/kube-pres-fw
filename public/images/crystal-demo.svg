<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Crystal demo image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9efcff"/>
      <stop offset="50%" stop-color="#57d6ff"/>
      <stop offset="100%" stop-color="#2e9bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="20" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <polygon points="128,28 188,96 160,212 96,212 68,96" fill="url(#crystal)" stroke="#d9ffff" stroke-width="4"/>
    <polyline points="128,28 128,212" stroke="#d9ffff" stroke-opacity="0.75" stroke-width="3" fill="none"/>
    <polyline points="68,96 128,120 188,96" stroke="#d9ffff" stroke-opacity="0.7" stroke-width="3" fill="none"/>
  </g>
</svg>
